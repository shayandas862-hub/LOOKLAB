<!doctype html>
<html>
<head>

<script type="importmap">

<style>
html, body { margin: 0; background: #000; overflow: hidden; width: 720px; height: 1280px; }

#card .line { font-size: 30px; font-weight: 600; letter-spacing: 0.08em; margin-top: 10px; color: #2a1424; }
#card .place { font-size: 20px; letter-spacing: 0.12em; margin-top: 8px; color: #2a1424; opacity: 0.8; }
#note { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; opacity: 0; font-size: 14px; letter-spacing: 0.05em; color: #fff; opacity: 0.7; }
</style>
</head>
<body>
<canvas id="out" width="720" height="1280"></canvas>
<div id="overlay"><div id="hud"></div><div id="card"><div class="name"></div><div class="line"></div><div class="place"></div></div><div id="note"></div></div>
<script type="module">
import { init, renderFrame, renderAt, renderPass } from './src/main.js';
