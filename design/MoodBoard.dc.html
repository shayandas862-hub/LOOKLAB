<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
:root{--bg0:#0D0D0D;--bg1:#151515;--bg2:#1C1C1C;--bg3:#262626;--line:#2A2A2A;--line2:#3A3A3A;--tx:#EDEDED;--tx2:#A6A6A6;--tx3:#808080;--sur:#101010;--acc:#22D3EE;--acc-ink:#04232A;--warn:#F5A524;--sh:0 16px 48px rgba(0,0,0,.5)}
html,body{margin:0;background:var(--bg0);color:var(--tx);font:13px/1.45 'Geist',system-ui,sans-serif}
*{box-sizing:border-box}
</style>
</helmet>
<div data-screen-label="Mood Board" style="height:100%;min-height:760px;display:grid;grid-template-columns:minmax(0,1fr) 300px;background:var(--bg0);color:var(--tx)">
  <section style="position:relative;overflow:auto;min-width:0;background:var(--bg0);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px">
    <div style="position:sticky;top:0;left:0;z-index:3;display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(var(--bg0) 60%,transparent)">
      <h1 style="margin:0;font-size:15px;font-weight:600">Mood board · Neel</h1>
      <span style="color:var(--tx3)">11 frames · 3 clusters</span>
      <div style="flex:1"></div>
      <button onClick="{{ addRef }}" title="board.add_reference" style="height:30px;padding:0 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);cursor:pointer">Add reference</button>
      <button onClick="{{ addNote }}" title="board.add_note" style="height:30px;padding:0 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);cursor:pointer">Add note</button>
    </div>
    <div style="position:relative;width:1180px;height:760px">
      <sc-for list="{{ clusters }}" as="c" hint-placeholder-count="3">
        <div style="position:absolute;left:{{ c.x }};top:{{ c.y }};width:{{ c.w }};padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(21,21,21,.85);display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:baseline;gap:8px"><span style="font-weight:600;font-size:14px">{{ c.title }}</span><span style="color:var(--tx3)">{{ c.count }}</span></div>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
            <sc-for list="{{ c.frames }}" as="f" hint-placeholder-count="4">
              <div style="display:flex;flex-direction:column;gap:4px">
                <div style="width:100%;aspect-ratio:2.39/1;background:var(--sur);position:relative;overflow:hidden;border:1px solid var(--line)"><image-slot style="position:absolute;inset:0;width:100%;height:100%" id="{{ f.slot }}" shape="rect" fit="contain" placeholder="{{ f.ph }}"></image-slot></div>
                <div style="display:flex;height:8px;border-radius:2px;overflow:hidden">
                  <sc-for list="{{ f.pal }}" as="p" hint-placeholder-count="5"><span style="flex:1;background:{{ p }}"></span></sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <sc-for list="{{ notes }}" as="n" hint-placeholder-count="3">
        <div style="position:absolute;left:{{ n.x }};top:{{ n.y }};width:190px;padding:12px;border-radius:4px;background:#E6E6E6;color:#141414;box-shadow:0 8px 20px rgba(0,0,0,.4);transform:rotate({{ n.rot }});display:flex;flex-direction:column;gap:6px">
          <span style="text-wrap:pretty">{{ n.text }}</span>
          <span style="font-size:11px;color:#555">{{ n.by }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <aside style="border-left:1px solid var(--line);background:var(--bg1);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="flex:1;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--tx3)">BOARD PALETTE</span>
      <span style="font-family:'Geist Mono',monospace;font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line2);color:var(--tx2)">MEASURED</span>
    </div>
    <div style="display:flex;height:14px;border-radius:3px;overflow:hidden">
      <sc-for list="{{ palette }}" as="s" hint-placeholder-count="8"><span style="flex:{{ s.share }};background:{{ s.hex }}"></span></sc-for>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px">
      <sc-for list="{{ palette }}" as="s" hint-placeholder-count="8">
        <div style="display:flex;align-items:center;gap:8px;height:26px">
          <span style="width:16px;height:16px;border-radius:3px;background:{{ s.hex }};border:1px solid rgba(255,255,255,.14)"></span>
          <span style="flex:1;font-family:'Geist Mono',monospace;font-size:12px">{{ s.hex }}</span>
          <span style="font-family:'Geist Mono',monospace;font-size:12px;color:var(--tx3)">{{ s.share }}%</span>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--tx3)">TAGS</span>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <sc-for list="{{ tags }}" as="t" hint-placeholder-count="6">
          <span style="height:26px;display:flex;align-items:center;padding:0 10px;border-radius:13px;border:{{ t.border }};color:var(--tx2)">{{ t.label }}</span>
        </sc-for>
      </div>
      <span style="font-size:11px;color:var(--tx3)">Dashed = AI suggested · solid = added by hand</span>
    </div>
    <div style="flex:1"></div>
    <button onClick="{{ extract }}" title="board.extract_palette" style="height:34px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);cursor:pointer">Extract palette</button>
    <button onClick="{{ exportPdf }}" title="board.export_pdf" style="height:40px;border-radius:8px;background:var(--acc);border:none;color:var(--acc-ink);font-weight:600;cursor:pointer">Export board (PDF)</button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CL = [
  ['Night interiors', 24, 70, 440, [['#1B2230','#3E4A52','#6E5B4A','#C7803A','#0D0F12'],['#141A22','#2E3A44','#8A6A48','#D9A66B','#0A0C0F'],['#1F2733','#4B5560','#5C4A3C','#B77A3E','#101216'],['#232B36','#394550','#7A6450','#E0B07A','#0E1013']]],
  ['Sodium & teal', 500, 70, 440, [['#0F2A2E','#1E4B52','#C77A2E','#E7A55A','#081416'],['#12303A','#2C5E66','#B86B2A','#F0BE78','#0A1619'],['#0D2226','#23474C','#D08A3C','#EFC48F','#070F10'],['#153038','#326A70','#A85F28','#DDA266','#0B1719']]],
  ['Close-ups', 24, 430, 440, [['#2A1E18','#6E4A36','#C58B62','#E9C9A0','#120C0A'],['#1B2230','#4A3A30','#B07850','#E6C29A','#0D0F12'],['#241C18','#5C4436','#C99A74','#F0D2AC','#100C0A']]],
];
const NOTES = [
  ['“The window light should feel like it belongs to the street, not the flat.”','Director · Mon', '980px', '90px', '2deg'],
  ['Keep the blue in the shadows, never on her face.','Director · Mon', '980px', '250px', '-2deg'],
  ['Close-ups: softer than 12C, same warmth.','DP · Tue', '500px', '470px', '1.5deg'],
];
class Component extends DCLogic {
  state = { notes: NOTES };
  renderVals() {
    const run = this.props.run || (() => {});
    return {
      clusters: CL.map(([title, x, y, w, frames], ci) => ({ title, x: x + 'px', y: y + 'px', w: w + 'px', count: frames.length + ' frames',
        frames: frames.map((pal, i) => ({ pal, slot: `board-${ci}-${i}`, ph: title + ' ' + (i + 1) })) })),
      notes: this.state.notes.map(([text, by, x, y, rot]) => ({ text, by, x, y, rot })),
      palette: [['#1B2230',24],['#3E4A52',16],['#C7803A',13],['#0F2A2E',12],['#6E5B4A',10],['#E9C9A0',9],['#2C5E66',9],['#0D0F12',7]].map(([hex, share]) => ({ hex, share })),
      tags: [['neo-noir','ai'],['sodium','ai'],['warm–cold tension','ai'],['hard key','hand'],['night interior','hand'],['lonely','ai']].map(([label, s]) => ({ label, border: s === 'ai' ? '1px dashed var(--line2)' : '1px solid var(--line2)' })),
      addRef: () => run('board.add_reference', 'Drop frames onto any empty slot'),
      addNote: () => { const t = window.prompt('Note'); if (t) this.setState(s => ({ notes:[...s.notes, [t, 'You · now', '980px', 410 + (s.notes.length - 3) * 150 + 'px', '-1deg']] })); },
      extract: () => run('board.extract_palette', 'Palette re-extracted from 11 frames'),
      exportPdf: () => run('board.export_pdf', 'Board exported · Neel_moodboard.pdf'),
    };
  }
}
</script>
</body>
</html>
