<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
:root{--bg0:#0D0D0D;--bg1:#151515;--bg2:#1C1C1C;--bg3:#262626;--line:#2A2A2A;--line2:#3A3A3A;--tx:#EDEDED;--tx2:#A6A6A6;--tx3:#808080;--sur:#101010;--acc:#22D3EE;--acc-ink:#04232A;--acc-soft:rgba(34,211,238,.12);--warn:#F5A524;--err:#F05252;--sh:0 16px 48px rgba(0,0,0,.5)}
html,body{margin:0;background:var(--bg0);color:var(--tx);font:13px/1.45 'Geist',system-ui,sans-serif}
*{box-sizing:border-box}
</style>
</helmet>
<div data-screen-label="Shots" style="height:100%;min-height:760px;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr) 112px;background:var(--bg0);color:var(--tx)">
  <section style="padding:20px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-width:0">
    <div style="display:flex;align-items:baseline;gap:12px">
      <h1 style="margin:0;font-size:18px;font-weight:600">Scene 12 “Kitchen, night”</h1>
      <span style="color:var(--tx3)">6 shots · 4 planned · previs 00:00:42</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">
      <sc-for list="{{ shots }}" as="s" hint-placeholder-count="6">
        <button onClick="{{ s.select }}" style="display:flex;flex-direction:column;padding:0;border-radius:10px;overflow:hidden;background:var(--bg1);border:1px solid {{ s.border }};color:var(--tx);cursor:pointer;text-align:left" style-hover="border-color:var(--line2)">
          <div style="width:100%;aspect-ratio:2.39/1;background:var(--sur);position:relative;overflow:hidden">
            <image-slot style="position:absolute;inset:0;width:100%;height:100%" id="{{ s.slot }}" shape="rect" fit="contain" placeholder="{{ s.ph }}"></image-slot>
            <span style="position:absolute;left:8px;top:8px;padding:2px 6px;border-radius:4px;background:rgba(13,13,13,.8);font-family:'Geist Mono',monospace;font-size:12px;color:#EDEDED;pointer-events:none">{{ s.code }}</span>
            <sc-if value="{{ s.playing }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;border:2px solid var(--acc);pointer-events:none"></span></sc-if>
          </div>
          <div style="padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;width:100%">
            <div style="display:flex;gap:10px;font-family:'Geist Mono',monospace;font-size:12px;color:var(--tx2)">
              <span style="color:var(--tx)">{{ s.size }}</span><span>{{ s.lens }}</span><span>{{ s.move }}</span><span style="flex:1"></span><span>{{ s.dur }}s</span>
            </div>
            <span style="align-self:flex-start;height:22px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:11px;border:1px solid var(--line2);font-size:11px;color:{{ s.stColor }}"><span style="width:6px;height:6px;border-radius:3px;background:{{ s.stDot }}"></span>{{ s.status }}</span>
          </div>
        </button>
      </sc-for>
    </div>
  </section>

  <aside style="grid-row:1 / 3;grid-column:2;border-left:1px solid var(--line);background:var(--bg1);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--tx3)">SELECTED SHOT</span>
      <span style="font-size:15px;font-weight:600">{{ cur.code }} · {{ cur.desc }}</span>
    </div>
    <sc-for list="{{ curRows }}" as="r" hint-placeholder-count="6">
      <div style="display:flex;min-height:28px;align-items:center;border-bottom:1px solid var(--line)">
        <span style="width:100px;color:var(--tx2)">{{ r.label }}</span>
        <span style="flex:1;font-family:'Geist Mono',monospace">{{ r.val }}</span>
      </div>
    </sc-for>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--tx3)">LINKED REFERENCE</span>
      <div style="width:100%;aspect-ratio:2.39/1;background:var(--sur);position:relative;overflow:hidden;border:1px solid var(--line)"><image-slot style="position:absolute;inset:0;width:100%;height:100%" id="{{ cur.refSlot }}" shape="rect" fit="contain" placeholder="Reference frame"></image-slot></div>
      <span style="font-family:'Geist Mono',monospace;font-size:12px;color:var(--tx2)">{{ cur.refText }}</span>
    </div>
    <div style="flex:1"></div>
    <button onClick="{{ openBreakdown }}" style="height:34px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);cursor:pointer">Open breakdown</button>
    <button onClick="{{ openPlan }}" style="height:34px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);cursor:pointer">Open in Set Plan</button>
    <button onClick="{{ openSheet }}" title="setsheet.generate" style="height:40px;border-radius:8px;background:var(--acc);border:none;color:var(--acc-ink);font-weight:600;cursor:pointer">Set sheet →</button>
  </aside>

  <section style="grid-row:2;grid-column:1;border-top:1px solid var(--line);background:var(--bg1);padding:14px 24px;display:flex;align-items:center;gap:16px;min-width:0">
    <button onClick="{{ togglePlay }}" title="shots.play_previs" style="height:40px;padding:0 16px;border-radius:8px;background:var(--acc);border:none;color:var(--acc-ink);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap">
      <span style="font-size:11px">{{ playGlyph }}</span>{{ playLabel }}
    </button>
    <span style="font-family:'Geist Mono',monospace;color:var(--tx2);width:96px">{{ tc }}</span>
    <div style="flex:1;position:relative;display:flex;gap:2px;height:48px;min-width:0">
      <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="6">
        <button onClick="{{ b.seek }}" style="flex:{{ b.dur }};min-width:0;border-radius:4px;background:{{ b.bg }};border:1px solid {{ b.border }};color:var(--tx2);font-family:'Geist Mono',monospace;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 8px;overflow:hidden">
          <span style="color:var(--tx)">{{ b.code }}</span><span>{{ b.dur }}s</span>
        </button>
      </sc-for>
      <span style="position:absolute;top:-6px;bottom:-6px;left:{{ head }};width:2px;background:var(--tx);pointer-events:none"></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SH = [
  ['12A','Wide, Rhea enters','WS','24 mm','static',6,'Set sheet ready'],
  ['12B','Arjun at the table','MS','35 mm','slow push',8,'Planned'],
  ['12C','Rhea at the counter','MCU','35 mm','static',9,'Planned'],
  ['12D','Hands, phone','ECU','85 mm','static',5,'Planned'],
  ['12E','Two-shot, window','MS','50 mm','pan right',8,'Reference'],
  ['12F','Rhea looks out','CU','50 mm','static',6,'Reference'],
];
const TOTAL = 42;
class Component extends DCLogic {
  state = { sel:2, t:0, playing:false };
  componentWillUnmount() { cancelAnimationFrame(this._r); }
  tick = ts => {
    if (!this._last) this._last = ts;
    const t = this.state.t + (ts - this._last) / 1000; this._last = ts;
    if (t >= TOTAL) { this.setState({ t:TOTAL, playing:false }); return; }
    this.setState({ t }); this._r = requestAnimationFrame(this.tick);
  };
  renderVals() {
    const { sel, t, playing } = this.state;
    const nav = this.props.nav || (() => {});
    let acc = 0; const starts = SH.map(s => { const a = acc; acc += s[5]; return a; });
    const curIdx = SH.findIndex((s, i) => t >= starts[i] && t < starts[i] + s[5]);
    const c = SH[sel];
    const fmt = x => '00:00:' + String(Math.floor(x)).padStart(2, '0');
    const statusStyle = st => st === 'Set sheet ready' ? ['var(--tx)','var(--acc)'] : st === 'Planned' ? ['var(--tx2)','var(--tx2)'] : ['var(--tx3)','transparent'];
    return {
      shots: SH.map(([code, desc, size, lens, move, dur, status], i) => ({ code, size, lens, move, dur, status, slot:'shot-' + code.toLowerCase(), ph:'Previs frame ' + code,
        border: i === sel ? 'var(--acc)' : 'var(--line)', playing: playing && curIdx === i,
        stColor: statusStyle(status)[0], stDot: statusStyle(status)[1], select: () => this.setState({ sel:i }) })),
      cur: { code:c[0], desc:c[1], refSlot: c[0] === '12C' ? 'ref-12c' : 'ref-' + c[0].toLowerCase(), refText: c[0] === '12C' ? 'ref_kitchen_night.mov · shot 3 · match 87%' : c[6] === 'Reference' ? 'Reference only, not planned yet' : 'Linked reference' },
      curRows: [['Shot size',c[2]],['Lens',c[3]],['Camera move',c[4]],['Duration',c[5] + ' s'],['Status',c[6]],['Key light', c[0] === '12C' ? '−58° / 24° · 2150 K' : '—']].map(([label,val]) => ({ label, val })),
      togglePlay: () => {
        if (playing) { cancelAnimationFrame(this._r); this.setState({ playing:false }); return; }
        this._last = 0; this.setState({ playing:true, t: t >= TOTAL ? 0 : t }); this._r = requestAnimationFrame(this.tick);
        this.props.run && this.props.run('shots.play_previs', 'Playing previs');
      },
      playGlyph: playing ? '❚❚' : '▶', playLabel: playing ? 'Pause' : 'Play previs 00:00:42',
      tc: fmt(t) + ' / 42',
      blocks: SH.map((s, i) => ({ code:s[0], dur:s[5], bg: curIdx === i && (playing || t > 0) ? 'var(--bg3)' : 'var(--bg2)', border: i === sel ? 'var(--acc)' : 'var(--line)', seek: () => this.setState({ t: starts[i], sel:i }) })),
      head: `calc(${t / TOTAL * 100}% - 1px)`,
      openBreakdown: () => nav('breakdown'), openPlan: () => nav('plan'), openSheet: () => nav('sheet'),
    };
  }
}
</script>
</body>
</html>
