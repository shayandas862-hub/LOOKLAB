<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Look Lab pitch</title>
<style>
@font-face { font-family: 'Geist'; font-weight: 300; src: url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-300-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 400; src: url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 500; src: url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 600; src: url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 700; src: url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 800; src: url(node_modules/@fontsource/geist-sans/files/geist-sans-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 400; src: url(node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 500; src: url(node_modules/@fontsource/geist-mono/files/geist-mono-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 600; src: url(node_modules/@fontsource/geist-mono/files/geist-mono-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 700; src: url(node_modules/@fontsource/geist-mono/files/geist-mono-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Serif'; font-style: normal; src: url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) format('woff2'); }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
import { init, renderFrame } from './src/main.js';
import { FPS, DURATION } from './src/timeline.js';
window.renderFrame = renderFrame;
window.ready = init(document.getElementById('out'));
if (location.search.includes('preview')) {
  const c = document.getElementById('out');
  c.style.width = '100vw'; c.style.height = 'auto';
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { renderFrame(Math.floor(((performance.now() - t0) / 1000 % DURATION) * FPS)); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
</html>
