<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg0:#0D0D0D;--bg1:#151515;--bg2:#1C1C1C;--bg3:#262626;--line:#2A2A2A;--line2:#3A3A3A;--tx:#EDEDED;--tx2:#A6A6A6;--tx3:#808080;--sur:#101010;--acc:#22D3EE;--acc-ink:#04232A;--acc-soft:rgba(34,211,238,.12);--warn:#F5A524;--sh:0 16px 48px rgba(0,0,0,.5)}
html,body{margin:0;background:var(--bg0);color:var(--tx);font:13px/1.45 'Geist',system-ui,sans-serif}
*{box-sizing:border-box}
</style>
</helmet>
<div data-screen-label="Activity" style="height:100%;min-height:760px;overflow:auto;padding:20px 24px;background:var(--bg0);color:var(--tx);display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;align-items:baseline;gap:12px">
    <h1 style="margin:0;font-size:18px;font-weight:600">Activity</h1>
    <span style="color:var(--tx3)">Every decision the system made, and whether a person agreed</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="color:var(--tx3);margin-right:4px">Tier</span>
    <sc-for list="{{ tierChips }}" as="c" hint-placeholder-count="5">
      <button onClick="{{ c.go }}" style="height:26px;padding:0 10px;border-radius:13px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.color }};cursor:pointer;font-size:12px">{{ c.label }}</button>
    </sc-for>
    <span style="color:var(--tx3);margin:0 4px 0 16px">Shot</span>
    <sc-for list="{{ shotChips }}" as="c" hint-placeholder-count="4">
      <button onClick="{{ c.go }}" style="height:26px;padding:0 10px;border-radius:13px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.color }};cursor:pointer;font-size:12px;font-family:'Geist Mono',monospace">{{ c.label }}</button>
    </sc-for>
    <span style="flex:1"></span>
    <span style="font-family:'Geist Mono',monospace;font-size:12px;color:var(--tx2)">{{ summary }}</span>
  </div>

  <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg1)">
    <div style="display:grid;grid-template-columns:64px minmax(0,2fr) 128px 56px minmax(0,1.6fr) 64px 64px 120px;gap:12px;align-items:center;height:36px;padding:0 14px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--tx3)">
      <span>TIME</span><span>ACTION</span><span>TIER</span><span>RULE</span><span>RESULT</span><span style="text-align:right">CONF.</span><span style="text-align:right">COST</span><span>VERDICT</span>
    </div>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
      <div style="border-bottom:1px solid var(--line);background:{{ r.bg }}">
        <button onClick="{{ r.toggle }}" style="width:100%;display:grid;grid-template-columns:64px minmax(0,2fr) 128px 56px minmax(0,1.6fr) 64px 64px 120px;gap:12px;align-items:center;min-height:40px;padding:0 14px;background:none;border:none;color:var(--tx);cursor:pointer;text-align:left" style-hover="background:var(--bg2)">
          <span style="font-family:'Geist Mono',monospace;color:var(--tx3)">{{ r.t }}</span>
          <span style="display:flex;flex-direction:column;min-width:0"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.action }}</span><span style="font-family:'Geist Mono',monospace;font-size:11px;color:var(--tx3)">{{ r.cmd }} · {{ r.shot }}</span></span>
          <span style="justify-self:start;height:22px;display:flex;align-items:center;padding:0 8px;border-radius:4px;border:{{ r.tierBorder }};color:var(--tx2);font-family:'Geist Mono',monospace;font-size:11px;white-space:nowrap">{{ r.tier }}</span>
          <span style="font-family:'Geist Mono',monospace;color:var(--tx2)">{{ r.rule }}</span>
          <span style="color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.result }}</span>
          <span style="font-family:'Geist Mono',monospace;text-align:right;color:{{ r.confColor }}">{{ r.conf }}</span>
          <span style="font-family:'Geist Mono',monospace;text-align:right;color:var(--tx2)">{{ r.cost }}</span>
          <span style="display:flex;align-items:center;gap:6px;color:{{ r.vColor }}"><span style="width:6px;height:6px;border-radius:3px;background:{{ r.vDot }}"></span>{{ r.verdict }}</span>
        </button>
        <sc-if value="{{ r.open }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:24px;padding:4px 14px 16px 90px">
            <div style="display:flex;flex-direction:column;gap:6px">
              <span style="font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--tx3)">INPUTS</span>
              <sc-for list="{{ r.inputs }}" as="i" hint-placeholder-count="3"><span style="font-family:'Geist Mono',monospace;font-size:12px;color:var(--tx2)">{{ i }}</span></sc-for>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px">
              <span style="font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--tx3)">WHY RULE {{ r.rule }} FIRED</span>
              <span style="color:var(--tx2);text-wrap:pretty">{{ r.why }}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px">
              <button onClick="{{ r.agree }}" style="height:28px;padding:0 12px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);cursor:pointer">Agree</button>
              <button onClick="{{ r.override }}" style="height:28px;padding:0 12px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);cursor:pointer">Override</button>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const TIERS = { T0:'T0 Instrument', T1:'T1 Fast model', T2:'T2 AI', T3:'T3 Human' };
const R = [
  ['19:48','Generated set sheet','setsheet.generate','12C','T0','R21','1 page, 9 gear items','—','₹0','Agreed',['plan v3','kit: 11 items'],'Deterministic: a saved plan always produces a sheet.'],
  ['19:42','Matched light to reference','plan.match_light','12C','T0','R13','Key moved 0.4 m, match 81 → 87%','—','₹0','Agreed',['ref: −60° / 25°, 8:1','plan: −52° / 21°, 6.1:1'],'Look match below 85% and the key was the largest contributor to the gap.'],
  ['19:40','Flagged power risk','adapt.check_power','12C','T0','R8','15 A point shared with fridge','—','₹0','Agreed',['COB 600 W ≈ 2.7 A','15 A point: fridge 1.2 A'],'Two loads on one point during takes. Rule R8 flags any shared point with an appliance that cycles.'],
  ['19:31','Generated recipe','adapt.generate_recipe','12C','T2','R4','3 steps, 1 gap, 1 risk','78%','₹22','Overridden',['breakdown 12C','location: Ballygunge kitchen','kit: 11 items'],'No recipe existed for a shot with a completed breakdown and a linked location.'],
  ['19:12','Estimated focal length','breakdown.fit_lens','12C','T2','R6','≈40 mm','72%','₹6','Agreed',['frame 2.39:1, 3840 px','face width 18% of frame'],'Lens metadata missing from the file, so the estimate came from subject scale and perspective.'],
  ['19:12','Fitted key light','breakdown.fit_light','12C','T2','R5','−60° az, 25° el, 2000 K','81%','₹9','Agreed',['shadow vectors ×14','white balance of highlights'],'A clear hard shadow edge was found. R5 runs the light fit when edge contrast is above 0.6.'],
  ['19:11','Sampled palette','breakdown.sample_palette','12C','T0','R2','6 shades, 100%','—','₹0','Agreed',['k-means, k=6','linear light'],'Always runs after import.'],
  ['19:11','Detected shots','breakdown.detect_shots','ref','T1','R1','7 shots','96%','₹1','Agreed',['ref_kitchen_night.mov','01:43 duration'],'Always runs after import.'],
  ['18:50','Marked camera height low-confidence','breakdown.review','12C','T3','R11','1.2 m, needs review','55%','₹0','Overridden',['AI estimate 1.2 m','DP set 1.15 m'],'Confidence below 60% routes the value to a person.'],
  ['18:20','Guessed practicals','breakdown.fit_light','12B','T2','R5','1 practical, pendant','52%','₹4','Overridden',['bright region top-centre'],'Bright region matched a lamp shape. DP marked it as a window reflection.'],
];
class Component extends DCLogic {
  state = { tier:'all', shot:'all', open:3, verdicts:{} };
  renderVals() {
    const { tier, shot, open, verdicts } = this.state;
    const run = this.props.run || (() => {});
    const chip = (on, label, go) => ({ label, go, border: on ? 'var(--acc)' : 'var(--line)', bg: on ? 'var(--acc-soft)' : 'transparent', color: on ? 'var(--tx)' : 'var(--tx2)' });
    const vis = R.map((r, i) => ({ r, i })).filter(({ r }) => (tier === 'all' || r[4] === tier) && (shot === 'all' || r[3] === shot));
    const cost = vis.reduce((a, { r }) => a + (parseInt(r[8].replace(/\D/g, '')) || 0), 0);
    return {
      tierChips: [['all','All']].concat(Object.entries(TIERS)).map(([id, label]) => chip(tier === id, label, () => this.setState({ tier:id }))),
      shotChips: [['all','All'],['12B','12B'],['12C','12C'],['ref','ref']].map(([id, label]) => chip(shot === id, label, () => this.setState({ shot:id }))),
      summary: `${vis.length} decisions · ₹${cost} today`,
      rows: vis.map(({ r, i }) => {
        const v = verdicts[i] || r[9];
        const confN = parseInt(r[7]);
        return {
          t:r[0], action:r[1], cmd:r[2], shot:r[3], tier:TIERS[r[4]], rule:r[5], result:r[6], conf:r[7], cost:r[8], verdict:v, inputs:r[10], why:r[11],
          tierBorder: r[4] === 'T2' ? '1px dashed var(--tx3)' : r[4] === 'T3' ? '1px solid var(--tx2)' : '1px solid var(--line2)',
          confColor: confN && confN < 60 ? 'var(--warn)' : 'var(--tx2)',
          vColor: v === 'Overridden' ? 'var(--tx)' : 'var(--tx2)', vDot: v === 'Overridden' ? 'var(--warn)' : 'var(--tx3)',
          open: open === i, bg: open === i ? 'var(--bg2)' : 'transparent',
          toggle: () => this.setState({ open: open === i ? null : i }),
          agree: () => { this.setState({ verdicts:{ ...verdicts, [i]:'Agreed' } }); run('log.set_verdict', 'Marked as agreed'); },
          override: () => { this.setState({ verdicts:{ ...verdicts, [i]:'Overridden' } }); run('log.set_verdict', 'Marked as overridden'); },
        };
      }),
    };
  }
}
</script>
</body>
</html>
