<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
:root,[data-theme="dark"]{--bg0:#0D0D0D;--bg1:#151515;--bg2:#1C1C1C;--bg3:#262626;--line:#2A2A2A;--line2:#3A3A3A;--tx:#EDEDED;--tx2:#A6A6A6;--tx3:#808080;--sur:#101010;--acc:#22D3EE;--acc-ink:#04232A;--acc-soft:rgba(34,211,238,.12);--warn:#F5A524;--warn-soft:rgba(245,165,36,.10);--err:#F05252;--err-soft:rgba(240,82,82,.10);--sh:0 16px 48px rgba(0,0,0,.5)}
[data-theme="light"]{--bg0:#DADADA;--bg1:#EFEFEF;--bg2:#FAFAFA;--bg3:#E2E2E2;--line:#D0D0D0;--line2:#B8B8B8;--tx:#141414;--tx2:#4D4D4D;--tx3:#6B6B6B;--sur:#C8C8C8;--acc:#0E7490;--acc-ink:#FFFFFF;--acc-soft:rgba(14,116,144,.12);--warn:#B45309;--warn-soft:rgba(180,83,9,.10);--err:#DC2626;--err-soft:rgba(220,38,38,.08);--sh:0 16px 48px rgba(0,0,0,.18)}
html,body{margin:0;background:var(--bg0);color:var(--tx);font:13px/1.45 'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
input::placeholder,textarea::placeholder{color:var(--tx3)}
button{font:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
</style>
</helmet>
<div data-theme="{{ theme }}" data-screen-label="Look Lab" style="height:100vh;min-width:1280px;min-height:760px;display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);background:var(--bg0);color:var(--tx)">

  <div style="grid-row:1;grid-column:1;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg1)">
    <div style="width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:var(--acc);background:var(--bg2)">LL</div>
  </div>

  <header style="grid-row:1;grid-column:2;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg1)">
    <nav style="display:flex;align-items:center;gap:8px;color:var(--tx2);min-width:0;white-space:nowrap">
      <button onClick="{{ goProjects }}" style="background:none;border:none;color:inherit;cursor:pointer;padding:0" style-hover="color:var(--tx)">Neel (short film)</button>
      <span style="color:var(--tx3)">/</span>
      <span>Scene 12 “Kitchen, night”</span>
      <span style="color:var(--tx3)">/</span>
      <span style="color:var(--tx);font-weight:500">Shot 12C</span>
      <span style="color:var(--tx3)">·</span>
      <span style="color:var(--tx)">{{ screenTitle }}</span>
    </nav>
    <div style="flex:1"></div>
    <button onClick="{{ openPalette }}" title="app.command_palette" style="display:flex;align-items:center;gap:8px;height:32px;width:260px;padding:0 8px 0 12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--tx3);cursor:pointer" style-hover="border-color:var(--line2)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="flex:1;text-align:left">Search or run a command</span>
      <span style="font-family:'Geist Mono',monospace;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--bg3);color:var(--tx2)">⌘K</span>
    </button>
    <button onClick="{{ goSettings }}" title="{{ aiPill.tip }}" style="display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);cursor:pointer;white-space:nowrap" style-hover="border-color:var(--line2)">
      <span style="width:8px;height:8px;border-radius:4px;background:{{ aiPill.dot }}"></span>
      <span>{{ aiPill.label }}</span>
    </button>
  </header>

  <aside style="grid-row:2;grid-column:1;display:flex;flex-direction:column;gap:2px;padding:8px 0;border-right:1px solid var(--line);background:var(--bg1)">
    <sc-for list="{{ navTop }}" as="n" hint-placeholder-count="9">
      <button onClick="{{ n.go }}" title="{{ n.label }}" style="position:relative;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:{{ n.bg }};border:none;color:{{ n.color }};cursor:pointer" style-hover="color:var(--tx)">
        <span style="position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:1px;background:{{ n.bar }}"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg>
        <span style="font-size:10px;line-height:1">{{ n.short }}</span>
      </button>
    </sc-for>
    <div style="flex:1"></div>
    <sc-for list="{{ navBottom }}" as="n" hint-placeholder-count="1">
      <button onClick="{{ n.go }}" title="{{ n.label }}" style="position:relative;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:{{ n.bg }};border:none;color:{{ n.color }};cursor:pointer" style-hover="color:var(--tx)">
        <span style="position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:1px;background:{{ n.bar }}"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg>
        <span style="font-size:10px;line-height:1">{{ n.short }}</span>
      </button>
    </sc-for>
  </aside>

  <main style="grid-row:2;grid-column:2;position:relative;min-width:0;min-height:0;overflow:hidden">
    <sc-if value="{{ is.projects }}" hint-placeholder-val="{{ false }}"><dc-import name="Projects" nav="{{ nav }}" run="{{ run }}" ai-ok="{{ aiOk }}" ai-msg="{{ aiMsg }}" set-bstate="{{ setBstate }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.breakdown }}" hint-placeholder-val="{{ true }}"><dc-import name="Breakdown" nav="{{ nav }}" run="{{ run }}" ai-ok="{{ aiOk }}" ai-msg="{{ aiMsg }}" bstate="{{ bstate }}" set-bstate="{{ setBstate }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.location }}" hint-placeholder-val="{{ false }}"><dc-import name="LocationKit" nav="{{ nav }}" run="{{ run }}" ai-ok="{{ aiOk }}" ai-msg="{{ aiMsg }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.plan }}" hint-placeholder-val="{{ false }}"><dc-import name="SetPlan" nav="{{ nav }}" run="{{ run }}" ai-ok="{{ aiOk }}" ai-msg="{{ aiMsg }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.shots }}" hint-placeholder-val="{{ false }}"><dc-import name="Shots" nav="{{ nav }}" run="{{ run }}" ai-ok="{{ aiOk }}" ai-msg="{{ aiMsg }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.board }}" hint-placeholder-val="{{ false }}"><dc-import name="MoodBoard" nav="{{ nav }}" run="{{ run }}" ai-ok="{{ aiOk }}" ai-msg="{{ aiMsg }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.sheet }}" hint-placeholder-val="{{ false }}"><dc-import name="SetSheet" nav="{{ nav }}" run="{{ run }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.library }}" hint-placeholder-val="{{ false }}"><dc-import name="Library" nav="{{ nav }}" run="{{ run }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.activity }}" hint-placeholder-val="{{ false }}"><dc-import name="Activity" nav="{{ nav }}" run="{{ run }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ is.settings }}" hint-placeholder-val="{{ false }}"><dc-import name="Settings" nav="{{ nav }}" run="{{ run }}" ai-state="{{ aiState }}" no-ai="{{ noAi }}" set-no-ai="{{ setNoAi }}" theme="{{ theme }}" set-theme="{{ setTheme }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></sc-if>

    <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--warn);color:var(--tx);font-size:12px;box-shadow:var(--sh);z-index:5">
        <span style="width:8px;height:8px;border-radius:4px;background:var(--warn)"></span>
        Offline. Local tools and manual editing still work. AI calls resume when you reconnect.
      </div>
    </sc-if>

    <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);box-shadow:var(--sh);z-index:20">
        <span style="width:6px;height:6px;border-radius:3px;background:var(--acc)"></span>
        <span>{{ toast.text }}</span>
        <span style="font-family:'Geist Mono',monospace;font-size:11px;color:var(--tx3)">{{ toast.cmd }}</span>
      </div>
    </sc-if>
  </main>

  <sc-if value="{{ palette }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closePalette }}" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:center;padding-top:120px">
      <div onClick="{{ stop }}" style="width:640px;max-height:520px;display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh);overflow:hidden">
        <div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--line)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--tx3)" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input ref="{{ pRef }}" value="{{ pq }}" onChange="{{ onPq }}" placeholder="Type a command or screen…" style="flex:1;background:none;border:none;outline:none;color:var(--tx);font:inherit;font-size:15px"></input>
          <span style="font-family:'Geist Mono',monospace;font-size:11px;color:var(--tx3)">esc</span>
        </div>
        <div style="overflow:auto;padding:6px">
          <sc-for list="{{ results }}" as="r" hint-placeholder-count="6">
            <button onClick="{{ r.go }}" onMouseEnter="{{ r.hover }}" style="width:100%;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:8px;border:none;background:{{ r.bg }};color:var(--tx);cursor:pointer;text-align:left">
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.label }}</span>
              <span style="font-family:'Geist Mono',monospace;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--tx2)">{{ r.name }}</span>
              <span style="width:56px;text-align:right;font-family:'Geist Mono',monospace;font-size:11px;color:var(--tx3)">{{ r.key }}</span>
            </button>
          </sc-for>
          <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
            <div style="padding:24px;text-align:center;color:var(--tx3)">No command matches “{{ pq }}”.</div>
          </sc-if>
        </div>
        <div style="display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--tx3)">
          <span>↑↓ move</span><span>↵ run</span><span style="flex:1"></span><span>Same commands are available as buttons and to Claude Code over MCP</span>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;aiState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;connected&quot;,&quot;not-connected&quot;,&quot;cap&quot;,&quot;offline&quot;],&quot;default&quot;:&quot;connected&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;States&quot;},&quot;breakdownState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;empty&quot;,&quot;uploading&quot;,&quot;analysing&quot;,&quot;low&quot;,&quot;error&quot;],&quot;default&quot;:&quot;ready&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;States&quot;}}">
const NAV = [
  { id:'projects', label:'Projects', short:'Projects', d:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
  { id:'breakdown', label:'Breakdown', short:'Breakdown', d:'M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M9 12h6M12 9v6' },
  { id:'location', label:'Location & Kit', short:'Adapt', d:'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z' },
  { id:'plan', label:'Set Plan', short:'Set Plan', d:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5' },
  { id:'shots', label:'Shots', short:'Shots', d:'M3 6h18v12H3zM3 10h18M3 14h18M8 6v12M16 6v12' },
  { id:'board', label:'Mood Board', short:'Board', d:'M3 4h8v10H3zM13 4h8v6h-8zM13 12h8v8h-8zM3 16h8v4H3z' },
  { id:'sheet', label:'Set Sheet', short:'Set Sheet', d:'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7M9 8h3' },
  { id:'library', label:'Library', short:'Library', d:'M5 4h4v16H5zM10 4h4v16h-4zM15.5 4.5l3.8-1 3.7 15.4-3.8 1z' },
  { id:'activity', label:'Activity', short:'Activity', d:'M3 12h4l3-8 4 16 3-8h4' },
];
const NAV_B = [{ id:'settings', label:'Settings', short:'Settings', d:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z' }];
const TITLES = { projects:'Projects', breakdown:'Breakdown', location:'Location & Kit', plan:'Set Plan', shots:'Shots', board:'Mood Board', sheet:'Set Sheet', library:'Library', activity:'Activity', settings:'Settings' };

const CMDS = [
  ['Import reference (video or image)','breakdown.import_reference','⌘I','breakdown','empty'],
  ['Analyse reference','breakdown.analyse','⌘⇧A','breakdown','analysing'],
  ['Fit light to reference','breakdown.fit_light','⌘⇧L','breakdown'],
  ['Sample palette from frame','breakdown.sample_palette','S','breakdown'],
  ['Save look to library','breakdown.save_look','⌘S'],
  ['Adapt to our location','adapt.open','⌘2','location'],
  ['Generate recipe (AI)','adapt.generate_recipe','⌘⇧R','location'],
  ['Write recipe by hand','adapt.write_recipe','','location'],
  ['Add light','plan.add_light','L','plan'],
  ['Match light in set plan','plan.match_light','⌘M','plan'],
  ['Switch to top-down plot','plan.set_view','T','plan'],
  ['Save as plan v3','plan.save_plan','⌘⇧S'],
  ['Play previs','shots.play_previs','Space','shots'],
  ['Extract palette from board','board.extract_palette','','board'],
  ['Export board (PDF)','board.export_pdf',''],
  ['Generate set sheet','setsheet.generate','','sheet'],
  ['Export set sheet (PDF)','setsheet.export_pdf','⌘P'],
  ['Apply look to shot…','library.apply_look','','library'],
  ['Copy Claude Code setup command','settings.copy_mcp_command','','settings'],
  ['Toggle No AI mode','settings.toggle_no_ai','','settings'],
  ['Open activity log','app.open_activity','⌘9','activity'],
  ['Go to Projects','app.open_projects','⌘0','projects'],
];

class Component extends DCLogic {
  state = { screen:'breakdown', palette:false, pq:'', psel:0, toast:null, noAi:false, theme:null, bstate:null };
  pRef = React.createRef();

  componentDidMount() {
    this._k = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); this.state.palette ? this.closeP() : this.openP(); return; }
      if (!this.state.palette) return;
      const res = this.results();
      if (e.key === 'Escape') this.closeP();
      else if (e.key === 'ArrowDown') { e.preventDefault(); this.setState(s => ({ psel: Math.min(s.psel + 1, res.length - 1) })); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState(s => ({ psel: Math.max(s.psel - 1, 0) })); }
      else if (e.key === 'Enter' && res[this.state.psel]) this.exec(res[this.state.psel]);
    };
    window.addEventListener('keydown', this._k);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._k); clearTimeout(this._tt); }

  openP() { this.setState({ palette:true, pq:'', psel:0 }, () => setTimeout(() => this.pRef.current && this.pRef.current.focus(), 30)); }
  closeP() { this.setState({ palette:false }); }
  nav = id => this.setState({ screen:id, palette:false });
  run = (cmd, text) => {
    clearTimeout(this._tt);
    this.setState({ toast:{ text: text || 'Done', cmd } });
    this._tt = setTimeout(() => this.setState({ toast:null }), 2600);
  };
  results() {
    const q = this.state.pq.trim().toLowerCase();
    return CMDS.filter(c => !q || c[0].toLowerCase().includes(q) || c[1].includes(q));
  }
  exec(c) {
    const [label, name, , screen, bs] = c;
    const patch = { palette:false };
    if (screen) patch.screen = screen;
    if (bs) patch.bstate = bs;
    this.setState(patch);
    this.run(name, label);
  }

  renderVals() {
    const { screen, palette, pq, psel, toast } = this.state;
    const theme = this.state.theme || this.props.theme || 'dark';
    const aiState = this.props.aiState || 'connected';
    const noAi = this.state.noAi;
    const bstate = this.state.bstate || this.props.breakdownState || 'ready';
    const aiOk = !noAi && aiState === 'connected';
    const aiMsg = noAi ? 'No AI mode is on' : aiState === 'not-connected' ? 'AI not connected' : aiState === 'cap' ? 'Monthly spend cap reached' : aiState === 'offline' ? 'Offline' : '';
    const pill = noAi ? { label:'No AI mode', dot:'var(--tx3)', tip:'Everything works by hand' }
      : aiState === 'connected' ? { label:'AI ready · Claude Code + API', dot:'var(--acc)', tip:'42 MCP tools · ₹340 of ₹2,000 used' }
      : aiState === 'not-connected' ? { label:'AI not connected', dot:'var(--tx3)', tip:'Manual tools still work' }
      : aiState === 'cap' ? { label:'Spend cap reached', dot:'var(--warn)', tip:'₹2,000 of ₹2,000 used this month' }
      : { label:'Offline', dot:'var(--warn)', tip:'AI resumes when you reconnect' };
    const mk = n => ({ ...n, go: () => this.nav(n.id), bg: screen === n.id ? 'var(--bg3)' : 'transparent', color: screen === n.id ? 'var(--tx)' : 'var(--tx3)', bar: screen === n.id ? 'var(--acc)' : 'transparent' });
    const res = this.results();
    const is = {}; Object.keys(TITLES).forEach(k => is[k] = screen === k);
    return {
      theme, is, screenTitle: TITLES[screen], aiPill: pill, aiOk, aiMsg, aiState, noAi, bstate,
      offline: aiState === 'offline',
      navTop: NAV.map(mk), navBottom: NAV_B.map(mk),
      nav: this.nav, run: this.run,
      setBstate: b => this.setState({ bstate:b }),
      setNoAi: v => this.setState({ noAi:v }),
      setTheme: t => this.setState({ theme:t }),
      goProjects: () => this.nav('projects'), goSettings: () => this.nav('settings'),
      openPalette: () => this.openP(), closePalette: () => this.closeP(), stop: e => e.stopPropagation(),
      palette, pq, pRef: this.pRef,
      onPq: e => this.setState({ pq:e.target.value, psel:0 }),
      results: res.map((c, i) => ({ label:c[0], name:c[1], key:c[2], bg: i === psel ? 'var(--bg3)' : 'transparent', go: () => this.exec(c), hover: () => this.setState({ psel:i }) })),
      noResults: res.length === 0,
      hasToast: !!toast, toast: toast || { text:'', cmd:'' },
    };
  }
}
</script>
</body>
</html>
